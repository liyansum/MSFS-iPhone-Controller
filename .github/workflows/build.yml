name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC x64 Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S Windows -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test core protocol
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSFSiPhoneController-Windows
          path: |
            build/Release/MSFSiPhoneController.exe
            build/Release/SimConnect.dll
          if-no-files-found: warn

  ios:
    name: iOS (Xcode Release)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep -E '^Xcode'

      - name: Select Xcode
        run: |
          # 优先使用与已安装模拟器运行时匹配的 Xcode，规避 actool 的
          # "No simulator runtime version" 问题
          for x in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app; do
            if [ -d "/Applications/$x" ]; then
              sudo xcode-select -s "/Applications/$x"
              break
            fi
          done
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project iOS/MSFSController.xcodeproj \
            -scheme MSFSController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MSFSController.app Payload/
          zip -qry MSFSController.ipa Payload/
          echo "IPA size: $(du -h MSFSController.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSFSController-iOS
          path: MSFSController.ipa
          if-no-files-found: warn
