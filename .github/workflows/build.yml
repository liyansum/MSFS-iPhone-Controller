name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC x64 Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S Windows -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test core protocol
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Force `
            -Path build/Release/MSFSiPhoneController.exe,build/Release/SimConnect.dll `
            -DestinationPath MSFSiPhoneController-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSFSiPhoneController-Windows
          path: MSFSiPhoneController-Windows-x64.zip
          if-no-files-found: error

  ios:
    name: iOS (Xcode Release)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep -E '^Xcode'

      - name: Select Xcode
        run: |
          # 优先使用与已安装模拟器运行时匹配的 Xcode，规避 actool 的
          # "No simulator runtime version" 问题
          for x in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app; do
            if [ -d "/Applications/$x" ]; then
              sudo xcode-select -s "/Applications/$x"
              break
            fi
          done
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project iOS/MSFSController.xcodeproj \
            -scheme MSFSController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MSFSController.app Payload/
          zip -qry MSFSController.ipa Payload/
          echo "IPA size: $(du -h MSFSController.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSFSController-iOS
          path: MSFSController.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: MSFSiPhoneController-Windows
          path: release-assets/windows

      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: MSFSController-iOS
          path: release-assets/ios

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/windows/MSFSiPhoneController-Windows-x64.zip \
              release-assets/ios/MSFSController.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/windows/MSFSiPhoneController-Windows-x64.zip \
              release-assets/ios/MSFSController.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MSFS iPhone Controller $GITHUB_REF_NAME" \
              --generate-notes
          fi
