name: MSFSController
options:
  bundleIdPrefix: com.msfs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  MSFSController:
    type: application
    platform: iOS
    sources:
      - path: MSFSController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msfs.iphonecontroller
        PRODUCT_NAME: MSFSController
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MSFS Controller
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MSFS 控制器需要通过局域网连接 Windows 端的 MSFS 伴侣程序。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
